[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerr-ds"
version = "0.1.0"
description = "Light deflection in Kerr-de Sitter spacetime (undergraduate thesis research)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NugiePhysics", email = "nugi.physics@gmail.com" }]
dependencies = [
    "numpy",
    "sympy",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
    "nbconvert",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
